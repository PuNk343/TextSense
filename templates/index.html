<!DOCTYPE html>
<html>
<head>
<title>Clarity Analyzer</title>

<style>
body {
    background-color: #0f172a;
    color: #e2e8f0;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px;
}

.container {
    width: 800px;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

textarea {
    width: 100%;
    height: 180px;
    padding: 15px;
    border-radius: 10px;
    border: none;
    outline: none;
    font-size: 16px;
    background-color: #1e293b;
    color: white;
}

.results {
    margin-top: 20px;
    padding: 20px;
    background-color: #1e293b;
    border-radius: 12px;
}

.result-item {
    margin: 8px 0;
    font-size: 16px;
}

#tone {
    font-weight: bold;
}

.positive { color: #22c55e; }
.negative { color: #ef4444; }
.neutral { color: #eab308; }

pre {
    background: #0f172a;
    padding: 10px;
    border-radius: 8px;
}
</style>

</head>

<body>

<div class="container">

<h1>Live Writing Clarity Analyzer</h1>

<textarea id="textInput" placeholder="Start typing your thoughts..."></textarea>

<div class="results">
    <div class="result-item">Words: <span id="words">0</span></div>
    <div class="result-item">Sentences: <span id="sentences">0</span></div>
    <div class="result-item">Reading Time: <span id="time">0</span> min</div>
    <div class="result-item">Tone: <span id="tone" class="neutral">Neutral</span></div>

    <div class="result-item">Tone Insight: <span id="toneMessage"></span></div>
    <div class="result-item">Detected Format: <span id="formatType"></span></div>

    <h4>Suggested Structure</h4>
    <pre id="formatSuggestion"></pre>

    <h4>Most Common Words</h4>
    <ul id="common"></ul>
</div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
